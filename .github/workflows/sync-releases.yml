name: Sync published release notes

on:
  workflow_dispatch:
  repository_dispatch:
    types: [typealoud-release-notes-ready]
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: write

concurrency:
  group: typealoud-release-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Sync the full published release snapshot
        run: |
          cp src/content/releases.json "$RUNNER_TEMP/previous-releases.json"
          npm run releases:sync
      - name: Sync the privacy page from PRIVACY.md
        run: npm run privacy:sync
      - name: Detect content changes
        id: changes
        run: |
          if git diff --quiet -- src/content/releases.json src/content/privacy.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare optional milestone draft
        if: steps.changes.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] && [ -n "$ANTHROPIC_MODEL" ]; then
            if ! npm run updates:draft -- --baseline "$RUNNER_TEMP/previous-releases.json"; then
              echo "::warning::AI draft failed. Review the synchronized release notes manually; curated milestones were not changed."
            fi
          else
            echo "No AI configuration; release-note synchronization works without it."
          fi
      - name: Validate the proposed content
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit validated release-content update to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/releases.json src/content/privacy.md
          if [ -f content-drafts/updates.json ]; then git add content-drafts/updates.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "content: sync TypeAloud release notes and privacy policy"
          git push origin HEAD:main